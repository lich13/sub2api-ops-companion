<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="{{ base_path }}/static/style.css?v=20260514-ui-3" />
    <script src="{{ base_path }}/static/table-columns.js?v=20260510-version" defer></script>
    <script src="{{ base_path }}/static/time-range.js?v=20260512-speed" defer></script>
    <script src="{{ base_path }}/static/group-picker.js?v=20260514-groups-2" defer></script>
    <script src="{{ base_path }}/static/version-panel.js?v=20260510-version" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="shell header-inner">
        <div class="brand">
          <span class="brand-mark">S</span>
          <div>
            <h1>{{ app_name }}</h1>
            <div class="brand-meta">
              <span>账号稳定性、速度和调度 Guard</span>
              {% if current_user %}
                <div class="version-widget" data-version-widget data-base-path="{{ base_path }}">
                  <button class="version-pill" type="button" data-version-toggle aria-expanded="false">
                    <span>v{{ version.current_version }}</span>
                    <i class="version-dot" data-version-dot></i>
                  </button>
                  <div class="version-popover" data-version-popover hidden>
                    <div class="version-popover-head">
                      <span>当前版本</span>
                      <button class="icon-button" type="button" data-version-refresh title="刷新">↻</button>
                    </div>
                    <div class="version-popover-body">
                      <div class="version-current">
                        <strong data-version-current>v{{ version.current_version }}</strong>
                        <span class="version-check" data-version-check>✓</span>
                      </div>
                      <p data-version-status>点击查看更新状态</p>
                      <dl class="version-meta-list">
                        <div><dt>当前提交</dt><dd class="mono" data-version-current-commit>-</dd></div>
                        <div><dt>远端提交</dt><dd class="mono" data-version-latest-commit>-</dd></div>
                      </dl>
                      <div class="version-actions">
                        <button class="primary small-button" type="button" data-version-update disabled>更新</button>
                        <a class="secondary-link" href="https://github.com/lich13/sub2api-ops-companion/releases" target="_blank" rel="noopener noreferrer">查看发布</a>
                      </div>
                    </div>
                  </div>
                </div>
              {% endif %}
            </div>
          </div>
        </div>
        {% if current_user %}
          <nav class="nav">
            <a class="{{ 'active' if active == 'stability' else '' }}" href="{{ base_path }}/">账号稳定性</a>
            <a class="{{ 'active' if active == 'speed' else '' }}" href="{{ base_path }}/speed">账号速度</a>
            <a class="{{ 'active' if active == 'requests' else '' }}" href="{{ base_path }}/requests">错误链路</a>
            <a class="{{ 'active' if active == 'scheduled_tests' else '' }}" href="{{ base_path }}/scheduled-tests">定时恢复</a>
            <a class="{{ 'active' if active == 'guard' else '' }}" href="{{ base_path }}/guard">自动 Guard</a>
            <a class="{{ 'active' if active == 'telegram' else '' }}" href="{{ base_path }}/telegram">Telegram</a>
            <form method="post" action="{{ base_path }}/logout">
              <button class="link-button" type="submit">退出</button>
            </form>
          </nav>
        {% endif %}
      </div>
    </header>
    <main class="shell page-shell">
      {% if msg %}
        <div class="notice">{{ msg }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
