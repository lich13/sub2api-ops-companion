<div class="guard-loaded-section table-panel guard-table-panel">
  <div class="section-head table-toolbar">
    <div>
      <h3>自动动作与人工建议</h3>
    </div>
    <details class="column-picker">
      <summary>选择列</summary>
      <div class="column-list" data-column-picker="guard-suggestions">
        <label><input type="checkbox" class="column-toggle" data-table="guard-suggestions" data-column="account" checked />账号</label>
        <label><input type="checkbox" class="column-toggle" data-table="guard-suggestions" data-column="action" checked />建议动作</label>
        <label><input type="checkbox" class="column-toggle" data-table="guard-suggestions" data-column="reason" checked />原因</label>
        <label><input type="checkbox" class="column-toggle" data-table="guard-suggestions" data-column="execute" checked />执行</label>
        <button type="button" class="link-button columns-reset" data-table="guard-suggestions">重置列</button>
      </div>
    </details>
  </div>

  {% if suggestions %}
    <div class="table-wrap">
      <table class="data-table guard-table" data-table-id="guard-suggestions">
        <thead>
          <tr>
            <th data-col="account">账号</th>
            <th data-col="action">建议动作</th>
            <th data-col="reason">原因</th>
            <th data-col="execute">执行</th>
          </tr>
        </thead>
        <tbody>
          {% for item in suggestions %}
            <tr>
              <td data-col="account">
                <strong class="account-title"><span class="account-id">#{{ item.account_id }}</span> {{ item.name }}</strong>
              </td>
              <td data-col="action">
                {% if item.action == "pause" %}
                  <span class="pill bad">暂停调度</span>
                {% else %}
                  <span class="pill warn">冷却 {{ item.minutes }} 分钟</span>
                {% endif %}
              </td>
              <td data-col="reason" class="suggestion-reason">{{ item.reason }}</td>
              <td data-col="execute">
                <form method="post" action="{{ base_path }}/guard/apply">
                  <input type="hidden" name="account_id" value="{{ item.account_id }}" />
                  <input type="hidden" name="action" value="{{ item.action }}" />
                  <input type="hidden" name="minutes" value="{{ item.minutes or 15 }}" />
                  <input type="hidden" name="reason" value="{{ item.reason }}" />
                  <button class="primary" type="submit">执行</button>
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <div class="empty-state">
      <strong>当前没有需要人工处理的建议</strong>
    </div>
  {% endif %}
</div>
