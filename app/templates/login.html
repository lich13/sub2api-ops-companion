<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 - {{ app_name }}</title>
    <link rel="stylesheet" href="{{ base_path }}/static/style.css?v=20260514-ui-1" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card">
        <div class="login-brand">
          <span class="brand-mark">S</span>
          <div>
            <h1>Sub2API Ops</h1>
            <p class="muted">页面内登录，Cookie 会话有效期 1 年。</p>
          </div>
        </div>
        {% if error %}
          <div class="notice bad-notice">用户名或密码不正确。</div>
        {% endif %}
        <form class="login-form" method="post" action="{{ base_path }}/login">
          <input type="hidden" name="next" value="{{ next }}" />
          <label>用户名
            <input name="username" autocomplete="username" autofocus />
          </label>
          <label>密码
            <input name="password" type="password" autocomplete="current-password" />
          </label>
          <button class="primary" type="submit">进入面板</button>
        </form>
        <p class="login-footnote">建议继续保留 nginx 侧访问控制；这里的登录只负责 Ops 面板会话。</p>
      </section>
    </main>
  </body>
</html>
