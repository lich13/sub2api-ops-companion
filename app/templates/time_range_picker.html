{% macro time_range_picker(time_range) %}
  <div class="time-range-field">
    <span class="filter-label">时间范围</span>
    <details class="time-range-picker" data-time-range-picker>
      <summary>
        <span class="calendar-icon" aria-hidden="true"></span>
        <span data-time-range-label>{{ time_range.label }}</span>
        <span class="chevron" aria-hidden="true">⌄</span>
      </summary>
      <div class="time-range-menu">
        <input type="hidden" name="time_range" value="{{ time_range.preset }}" data-time-range-preset />
        <div class="time-range-presets" role="list">
          {% for item in time_range.presets %}
            <button
              type="button"
              class="time-range-option {{ 'active' if item.selected else '' }}"
              data-time-range-option
              data-preset="{{ item.value }}"
              data-label="{{ item.label }}"
              data-start="{{ item.start_date }}"
              data-end="{{ item.end_date }}"
            >{{ item.label }}</button>
          {% endfor %}
        </div>
        <div class="time-range-dates">
          <label class="time-date-field">开始日期
            <input type="date" name="start_date" value="{{ time_range.start_date }}" data-time-range-start />
          </label>
          <span class="date-arrow" aria-hidden="true">→</span>
          <label class="time-date-field">结束日期
            <input type="date" name="end_date" value="{{ time_range.end_date }}" data-time-range-end />
          </label>
        </div>
        <div class="time-range-footer">
          <button class="primary" type="submit">应用</button>
        </div>
      </div>
    </details>
  </div>
{% endmacro %}
