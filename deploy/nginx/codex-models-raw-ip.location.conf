# Raw-IP ingress did not expose an ordinary /models list. Preserve that rule.
location = /v1/models {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass $sub2ops_models_backend$request_uri;
    include /etc/nginx/snippets/sub2ops-models-proxy.conf;
}
location = /models {
    if ($sub2ops_models_backend = "http://127.0.0.1:8080") { return 404; }
    proxy_pass $sub2ops_models_backend$request_uri;
    include /etc/nginx/snippets/sub2ops-models-proxy.conf;
}
location = /backend-api/codex/models {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18081;
    include /etc/nginx/snippets/sub2ops-models-proxy.conf;
}
location @sub2ops_native_models {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
