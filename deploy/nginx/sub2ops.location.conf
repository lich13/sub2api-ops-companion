# Include inside the existing TLS server. The retired browser surface is 404.
location = /sub2ops { return 404; }
location = /sub2ops/healthz {
    access_log off;
    proxy_pass http://127.0.0.1:18081/healthz;
}
location ^~ /sub2ops/api/desktop/v1/ {
    access_log off;
    proxy_pass http://127.0.0.1:18081/api/desktop/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
    proxy_request_buffering off;
}
location ^~ /sub2ops/ { return 404; }
