events {}
http {
    access_log off;
    include /etc/nginx/snippets/codex-models.map.conf;
    server {
        listen 8080;
        location / { proxy_pass http://sub2api:8080; }
    }
    server {
        listen 18084;
        include /etc/nginx/snippets/codex-models.location.conf;
        include /etc/nginx/snippets/sub2ops.location.conf;
        location / { proxy_pass http://sub2api:8080; }
    }
}
