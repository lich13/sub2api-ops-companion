[package]
name = "lmfpd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Language-model fingerprint detection: offline scoring, challenges, and live detection"
repository = "https://github.com/Ikaleio/lm-detector"
homepage = "https://lm.ikale.io"
documentation = "https://lm.ikale.io/docs/en/sdk"
readme = "README.md"
keywords = ["llm", "fingerprint", "model-detection"]
categories = ["api-bindings", "text-processing"]

[features]
default = ["network"]
network = ["dep:ureq", "dep:ruzstd", "dep:url"]

[dependencies]
getrandom = "0.4.3"
regex = "1.13.1"
ruzstd = { version = "0.9.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", optional = true }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.29.0", features = ["v4"] }
