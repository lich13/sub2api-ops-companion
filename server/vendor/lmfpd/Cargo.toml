[package]
name = "lmfpd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Language-model fingerprint detection: offline scoring and challenges"
repository = "https://github.com/Ikaleio/lm-detector"
homepage = "https://lm.ikale.io"
documentation = "https://lm.ikale.io/docs/en/sdk"
readme = "README.md"
keywords = ["llm", "fingerprint", "model-detection"]
categories = ["api-bindings", "text-processing"]

[dependencies]
getrandom = "0.4.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }
