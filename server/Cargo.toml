[package]
name = "sub2ops-server"
version = "0.1.109"
edition = "2021"
rust-version = "1.99"
publish = false

[features]
test-fixtures = []

[dependencies]
sub2ops-protocol = { path = "protocol" }
lmfpd = { path = "vendor/lmfpd", default-features = false }
fancy-regex = "0.16"
base64 = "0.22"
axum = "0.8"
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "http2", "gzip"] }
# Enable data/runtime features on the used PostgreSQL components directly.
# The facade's cross-driver features otherwise lock unused MySQL/RSA packages.
sqlx = { version = "0.8", default-features = false, features = ["postgres"] }
sqlx-core = { version = "0.8", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json", "chrono", "bigdecimal", "uuid"] }
sqlx-postgres = { version = "0.8", default-features = false, features = ["json", "chrono", "bigdecimal", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
yaml_serde = "0.10.7"
libc = "0.2"
sha2 = "0.10"
sha1 = "0.10"
httpdate = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
futures-util = "0.3"
regex = "1"
tempfile = "3"
chrono-tz = "0.10.4"

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
