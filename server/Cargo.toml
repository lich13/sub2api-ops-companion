[package]
name = "sub2ops-server"
version = "0.1.40"
edition = "2021"
rust-version = "1.94"
publish = false

[features]
test-fixtures = []

[dependencies]
base64 = "0.22"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "bigdecimal", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha1 = "0.10"
httpdate = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
futures-util = "0.3"
regex = "1"
tempfile = "3"
chrono-tz = "0.10.4"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
