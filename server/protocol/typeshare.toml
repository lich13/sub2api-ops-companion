[swift]
default_decorators = ["Sendable", "Equatable"]
default_generic_constraints = ["Sendable", "Equatable"]

[swift.type_mappings]
Json = "JSONValue"
Integer = "Int"
FlexibleBankVersion = "FingerprintBankVersion"
DetectionBasis = "String"
DetectionEngineWire = "String"
VerdictModeWire = "String"
UsageActionWire = "String"
UsageBranchWire = "String"
UsageStatusWire = "String"
WindowStatusWire = "String"
WindowColorWire = "String"
KeyQuotaStateWire = "String"
KeyQuotaSourceWire = "String"
StatsStatusWire = "String"
CreditEvidenceSourceWire = "String"
RecoveryKindWire = "String"

[typescript.type_mappings]
Json = "unknown"
Integer = "number"
FlexibleBankVersion = "{ revision: string; sha256?: string; built_at?: string; analyzer_version?: number | string }"
DetectionBasis = "(\"first_group\" | \"aggregate\" | \"sample_family\")"
DetectionEngineWire = "(\"modeltrace\" | \"lm_detector\")"
VerdictModeWire = "(\"strict\" | \"relaxed\")"
UsageActionWire = "(\"query_usage\" | \"query_reset_credits\" | \"reset_quota\" | \"probe_quota\")"
UsageBranchWire = "(\"none\" | \"apikey\" | \"openai_oauth\" | \"grok_free\" | \"grok_paid\" | \"native\")"
UsageStatusWire = "(\"known\" | \"unavailable\" | \"error\" | \"authorization_required\")"
WindowStatusWire = "(\"known\" | \"unknown\" | \"stale\" | \"error\")"
WindowColorWire = "(\"indigo\" | \"emerald\" | \"purple\")"
KeyQuotaStateWire = "(\"idle\" | \"loading\" | \"ok\" | \"error\" | \"unsupported\")"
KeyQuotaSourceWire = "(\"sub2api\" | \"newapi\")"
StatsStatusWire = "(\"ok\" | \"error\")"
CreditEvidenceSourceWire = "(\"upstream_error\" | \"account_rate_limit\")"
RecoveryKindWire = "(\"quota_recovery\" | \"reset_credit\" | \"connection_test\")"
