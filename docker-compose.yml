services:
  sub2api-ops-companion:
    image: ${OPS_IMAGE:-sub2ops-companion:local}
    build:
      context: .
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
    container_name: sub2api-ops-companion
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env
    user: "${OPS_CONTAINER_USER:-10001:10001}"
    ports:
      - "127.0.0.1:18081:18081"
    volumes:
      - ./data:/data
    networks:
      - sub2api-network

networks:
  sub2api-network:
    external: true
    name: sub2api_sub2api-network
