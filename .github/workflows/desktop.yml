name: Desktop
on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['desktop/**', 'app/**', 'tests/**', '.github/workflows/desktop.yml', 'requirements.txt']
  pull_request:
    paths: ['desktop/**', 'app/**', 'tests/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m compileall -q app tests
      - run: docker build -t sub2ops-desktop-check .
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: rustup toolchain install 1.94.1 --profile minimal --component clippy --target aarch64-apple-darwin
      - run: rustup override set 1.94.1
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm test && pnpm build
        working-directory: desktop
      - run: cargo test --locked && cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: pnpm bundle
        working-directory: desktop
      - name: Package and checksum
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sub2Ops.app artifacts/Sub2Ops_aarch64.app.zip
          cp desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg artifacts/
          cd artifacts
          shasum -a 256 *.zip *.dmg > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Sub2Ops-macos-aarch64
          path: artifacts/
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [backend, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Sub2Ops-macos-aarch64
          path: artifacts
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "Sub2Ops ${GITHUB_REF_NAME#desktop-v}" --notes-file desktop/RELEASE.md
