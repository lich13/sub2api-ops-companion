name: Desktop
on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['desktop/**', 'app/**', 'tests/**', 'scripts/**', '.github/workflows/desktop.yml', 'requirements.txt', '.dockerignore', '.env.example']
  pull_request:
    paths: ['desktop/**', 'app/**', 'tests/**', 'scripts/**', '.github/workflows/desktop.yml', 'requirements.txt', '.dockerignore', '.env.example']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sub2ops_qa
          POSTGRES_PASSWORD: fixture-postgres
          POSTGRES_DB: sub2ops_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sub2ops_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUB2OPS_TEST_DATABASE_URL: postgresql://sub2ops_qa:fixture-postgres@127.0.0.1:5432/sub2ops_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m compileall -q app tests
      - run: docker build -t sub2ops-desktop-check .
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Prepare isolated browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/sub2ops-browser-qa" --no-save --package-lock=false playwright@1.56.0
          node "$RUNNER_TEMP/sub2ops-browser-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check responsive layouts
        run: NODE_PATH="$RUNNER_TEMP/sub2ops-browser-qa/node_modules" node scripts/responsive_check.cjs
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: rustup toolchain install 1.94.1 --profile minimal --component clippy --target aarch64-apple-darwin
      - run: rustup override set 1.94.1
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm test && pnpm build
        working-directory: desktop
      - run: cargo test --locked && cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: pnpm bundle
        working-directory: desktop
      - name: Package and checksum
        run: |
          mkdir -p artifacts
          cp desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: Sub2Ops-macos-aarch64
          path: artifacts/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - run: rustup toolchain install 1.94.1 --profile minimal --target aarch64-linux-android
      - run: rustup override set 1.94.1
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.SUB2OPS_ANDROID_KEYSTORE }}
          SIGNING_PROPERTIES: ${{ secrets.SUB2OPS_ANDROID_SIGNING }}
        run: |
          test -n "$SIGNING_KEY" && test -n "$SIGNING_PROPERTIES"
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > /tmp/sub2ops-android-release.p12
          printf '%s' "$SIGNING_PROPERTIES" > /tmp/sub2ops-android-release.properties
          echo 'SUB2OPS_ANDROID_SIGNING_PROPERTIES=/tmp/sub2ops-android-release.properties' >> "$GITHUB_ENV"
      - name: Build ARM64 APK
        working-directory: desktop
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          pnpm tauri android build --apk --target aarch64 ${{ github.event_name == 'pull_request' && '--debug' || '' }}
      - name: Verify and package
        run: |
          mkdir -p artifacts
          APK=$(find desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' ! -name '*unsigned*' ! -name '*androidTest*' -print -quit)
          test -n "$APK"
          python scripts/verify_android.py "$APK"
          VERSION=$(node -p "require('./desktop/package.json').version")
          cp "$APK" "artifacts/Sub2Ops_${VERSION}_arm64-v8a.apk"
      - name: Compile independent device acceptance tests
        run: |
          node scripts/android_fixtures.mjs
          cd desktop/src-tauri/gen/android
          ./gradlew :releaseSmoke:assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Sub2Ops-android-arm64
          path: artifacts/
      - name: Remove signing material
        if: always()
        run: rm -f -- /tmp/sub2ops-android-release.p12 /tmp/sub2ops-android-release.properties
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [backend, browser, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Sub2Ops-*
          merge-multiple: true
          path: artifacts
      - name: Unified checksums
        working-directory: artifacts
        run: sha256sum *.dmg *.apk > SHA256SUMS
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "Sub2Ops ${GITHUB_REF_NAME#desktop-v}" --notes-file desktop/RELEASE.md
