name: Desktop
on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['desktop/**', 'server/**', 'tests/**', 'scripts/**', 'Dockerfile', 'docker-compose.yml', '.github/workflows/desktop.yml', 'requirements.txt', '.dockerignore', '.env.example', 'README.md', 'UPGRADING.md', 'docs/**']
  pull_request:
    paths: ['desktop/**', 'server/**', 'tests/**', 'scripts/**', 'Dockerfile', 'docker-compose.yml', '.github/workflows/desktop.yml', 'requirements.txt', '.dockerignore', '.env.example', 'README.md', 'UPGRADING.md', 'docs/**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
permissions:
  contents: read
env:
  RUSTFLAGS: --remap-path-prefix=/Users/runner=/build --remap-path-prefix=/home/runner=/build
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_release_versions.py
      - run: python scripts/server_reference.py
      - run: pip install -r requirements.txt
      - name: Prepare Rust and disposable PostgreSQL
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.99.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server -> target
          key: audit-0.22.2
      - name: Audit both locked Rust dependency graphs
        run: |
          if [ "$(cargo audit --version 2>/dev/null || true)" != 'cargo-audit 0.22.2' ]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi
          cargo audit --file server/Cargo.lock
          cargo audit --file desktop/src-tauri/Cargo.lock
      - run: cargo fetch --locked --manifest-path server/Cargo.toml
      - name: Fixed Python regression and complete Rust regression
        run: |
          python scripts/server_reference_tests.py
          python scripts/server_request_fixtures.py
          python scripts/server_contract_inventory.py --check --require-complete
          cargo fmt --check --manifest-path server/Cargo.toml
          python scripts/server_test.py
          cargo clippy --locked --offline --manifest-path server/Cargo.toml --all-targets --features test-fixtures -- -D warnings
          cargo build --locked --offline --manifest-path server/Cargo.toml
          cargo build --locked --offline --manifest-path server/Cargo.toml --example supervision_fixture --features test-fixtures
      - name: Shared full-service HTTP and mutation contracts
        run: |
          mkdir -p ci-results
          python scripts/server_http_contract.py > ci-results/python-http.json
          python scripts/server_http_contract.py --command-json '["server/target/debug/sub2ops-server"]' > ci-results/rust-http.json
          python scripts/server_mutation_contract.py > ci-results/python-mutations.json
          python scripts/server_mutation_contract.py --command-json '["server/target/debug/sub2ops-server"]' > ci-results/rust-mutations.json
      - name: Build and inspect the exact Linux runtime
        run: python scripts/server_images.py --revision "$GITHUB_SHA" --output-dir companion-artifact
      - name: Verify isolated healthcheck and fault restart
        run: python scripts/server_runtime_smoke.py --image sub2ops-companion:ci --fixture server/target/debug/examples/supervision_fixture > ci-results/runtime-smoke.json
      - name: Compare two complete runtimes on the same x86_64 host
        run: python scripts/server_benchmark.py --python-image sub2ops-companion:python-reference --rust-image sub2ops-companion:ci > ci-results/full-runtime-benchmark.json
      - name: Check repeated quality refreshes with large synthetic history
        run: python scripts/server_history_memory.py --python-image sub2ops-companion:python-reference --rust-image sub2ops-companion:ci > ci-results/history-memory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Companion-validation
          path: ci-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Companion-linux-amd64
          path: companion-artifact/
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-1.56.0
      - name: Prepare isolated browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/sub2ops-browser-qa" --no-save --package-lock=false playwright@1.56.0
          node "$RUNNER_TEMP/sub2ops-browser-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check responsive layouts
        run: NODE_PATH="$RUNNER_TEMP/sub2ops-browser-qa/node_modules" node scripts/responsive_check.cjs
  macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy --target aarch64-apple-darwin
      - run: rustup override set 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: macos-aarch64
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm test && pnpm build
        working-directory: desktop
      - run: cargo test --locked && cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: pnpm bundle
        working-directory: desktop
      - name: Check packaged macOS privacy and signature
        run: |
          python3 -m unittest discover -s scripts -p test_native_privacy.py
          python3 scripts/verify_native_privacy.py desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sub2Ops.app/Contents/MacOS/sub2ops
          codesign --verify --deep --strict desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sub2Ops.app
      - name: Package and checksum
        run: |
          mkdir -p artifacts
          cp desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg artifacts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sub2Ops-macos-aarch64
          path: artifacts/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - run: rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android
      - run: rustup override set 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: android-aarch64-ndk-28.2.13676358
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.SUB2OPS_ANDROID_KEYSTORE }}
          SIGNING_PROPERTIES: ${{ secrets.SUB2OPS_ANDROID_SIGNING }}
        run: |
          test -n "$SIGNING_KEY" && test -n "$SIGNING_PROPERTIES"
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > /tmp/sub2ops-android-release.p12
          printf '%s' "$SIGNING_PROPERTIES" > /tmp/sub2ops-android-release.properties
          echo 'SUB2OPS_ANDROID_SIGNING_PROPERTIES=/tmp/sub2ops-android-release.properties' >> "$GITHUB_ENV"
      - name: Build ARM64 APK
        working-directory: desktop
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          pnpm tauri android build --apk --target aarch64 ${{ github.event_name == 'pull_request' && '--debug' || '' }}
      - name: Verify and package
        run: |
          mkdir -p artifacts
          APK=$(find desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' ! -name '*unsigned*' ! -name '*androidTest*' -print -quit)
          test -n "$APK"
          python scripts/verify_android.py "$APK"
          VERSION=$(node -p "require('./desktop/package.json').version")
          cp "$APK" "artifacts/Sub2Ops_${VERSION}_arm64-v8a.apk"
      - name: Compile independent device acceptance tests
        run: |
          node scripts/android_fixtures.mjs
          cd desktop/src-tauri/gen/android
          ./gradlew :releaseSmoke:assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sub2Ops-android-arm64
          path: artifacts/
      - name: Remove signing material
        if: always()
        run: rm -f -- /tmp/sub2ops-android-release.p12 /tmp/sub2ops-android-release.properties
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [backend, browser, macos, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Sub2Ops-*
          merge-multiple: true
          path: artifacts
      - name: Unified checksums
        working-directory: artifacts
        run: sha256sum *.dmg *.apk > SHA256SUMS
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --draft --verify-tag --title "Sub2Ops ${GITHUB_REF_NAME#desktop-v}" --notes-file desktop/RELEASE.md
