[package]
name = "sub2ops"
version = "0.1.105"
description = "Sub2API Ops desktop companion"
edition = "2021"
rust-version = "1.99"

[lib]
name = "sub2ops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Keep the build helpers and runtime on the same reviewed Tauri release family.
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
sub2ops-protocol = { path = "../../server/protocol" }
tauri = { version = "~2.12.5", features = [] }
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "gzip"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-dialog = "~2.8.4"
tauri-plugin-fs = "~2.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
glib = { path = "vendor/glib" }
glib-macros = { path = "vendor/glib-macros" }
gtk3-macros = { path = "vendor/gtk3-macros" }
tauri-plugin-opener = { path = "vendor/tauri-plugin-opener" }
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }

[profile.dev]
strip = "debuginfo"

[profile.dev.build-override]
strip = "none"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Keep host proc-macro dylibs loadable with Apple's current linker; stripping
# their symbols can produce a misaligned LINKEDIT string pool on Apple Silicon.
[profile.release.build-override]
strip = "none"
