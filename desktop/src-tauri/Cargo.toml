[package]
name = "sub2ops"
version = "0.1.76"
description = "Sub2API Ops desktop companion"
edition = "2021"
rust-version = "1.99"

[lib]
name = "sub2ops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Keep the build helpers and runtime on the same reviewed Tauri release family.
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "~2.8.3"
tauri-plugin-fs = "~2.7.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "~2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSStatusItem", "NSStatusBarButton", "NSMenu", "NSApplication", "NSResponder"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
glib = { path = "vendor/glib" }
glib-macros = { path = "vendor/glib-macros" }
gtk3-macros = { path = "vendor/gtk3-macros" }
tauri-plugin-opener = { path = "vendor/tauri-plugin-opener" }
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Keep host proc-macro dylibs loadable with Apple's current linker; stripping
# their symbols can produce a misaligned LINKEDIT string pool on Apple Silicon.
[profile.release.build-override]
strip = "none"
